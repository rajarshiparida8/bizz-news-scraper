name: Run News Scraper Every 5 Minutes

on:
  schedule:
    - cron: '*/5 * * * *'  # every 5 minutes
  workflow_dispatch:      # allows manual trigger

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run scraper script
      run: |
        python BIZZStat.py

    - name: Commit and push updated JSON to repo
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com
        git add docs/news_output.json
        git commit -m "🔄 Update news_output.json [bot]" || echo "No changes to commit"
        git push https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git HEAD:main
